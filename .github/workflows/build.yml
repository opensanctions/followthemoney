name: build
on:
  - push
  - pull_request
  - workflow_dispatch

permissions:
  id-token: write
  packages: write
  contents: read
  attestations: write
  artifact-metadata: write

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
      - name: Show ref
        run: |
          echo "$GITHUB_REF"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq libicu-dev
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run checks for default model
        run: |
          python contrib/check_model.py
          make default-model
          git diff
          if [[ -z "$(git status --porcelain)" ]];
          then
            echo "Default model is up to date 👌"
          else
            echo "⚠️ Default model is not up to date. You need to run `make default-model` and commit the changes.";
            exit 1;
          fi;
      - name: Run the tests
        run: |
          make test
      - name: Partial mypy type-check
        run: |
          make typecheck

  # Single wheel/sdist build for PyPI. Pure-Python wheels are py3-none-any, so
  # building once (not once per matrix shard) is correct and keeps the
  # build-provenance attestation tied to a single set of artifact bytes.
  wheel:
    name: wheel + sdist
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build tool
        run: python -m pip install --upgrade pip build
      - name: Build wheel and sdist
        run: python3 -m build
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'
      - name: Publish followthemoney to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true

  # Attach the dumped model to the GitHub Release so each version has a stable,
  # path-independent URL:
  #   .../releases/download/<tag>/model.json   (immutable, per-version)
  #   .../releases/latest/download/model.json  (floating "latest" pointer)
  # The bytes are the same ones the `python` job verified are up to date.
  model:
    runs-on: ubuntu-latest
    needs: python
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Stage the model as model.json
        run: cp js/src/defaultModel.json model.json
      - uses: softprops/action-gh-release@v3
        with:
          files: model.json

  nodejs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    defaults:
      run:
        working-directory: ./js
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: |
          npm install -g npm@latest
          npm install
          npm run build
      - name: Run the tests
        run: |
          npm run test:prod && npm run lint
      - name: Pack tarball
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        id: pack
        run: |
          TARBALL=$(npm pack --silent)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        with:
          subject-path: js/${{ steps.pack.outputs.tarball }}
      - name: Publish to NPM
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        run: |
          npm publish --access public "./${{ steps.pack.outputs.tarball }}"

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Publish package
        run: mvn -P release --batch-mode deploy -DskipTests
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  docker:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags')
    steps:
      - uses: actions/checkout@v7
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/opensanctions/followthemoney
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Set env
        run: echo "VERSION_NUMBER=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
      - name: Login to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha
      - name: Build and push docker image
        id: push
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest build provenance to OCI registry
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/opensanctions/followthemoney
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Generate CycloneDX SBOM for image
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/opensanctions/followthemoney@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Attest SBOM to OCI registry
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/opensanctions/followthemoney
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
