Risk:
  label: Risk
  plural: Risks
  description: >
    A risk designation attached to an entity by an authority. Distinct from `Sanction`:
    a `Risk` flags heightened exposure or scrutiny, not a legally binding restriction.
  extends:
    - Interval
  matchable: false
  featured:
    - entity
    - country
    - authority
    - program
    - startDate
  required:
    - entity
  caption:
    - reason
    - status
  properties:
    entity:
      label: "Entity"
      reverse:
        name: risks
        label: "Risks"
      type: entity
      range: Thing
    authority:
      label: "Authority"
      description: "The body issuing the designation, e.g. FATF, European Commission, FinCEN, ONDCP"
    program:
      label: "Program"
      description: "The list or programme under which the designation is made"
    programId:
      label: "Program ID"
      type: identifier
      maxLength: 64
    programUrl:
      label: "Program URL"
      type: url
    topics:
      label: Topics
      type: topic
    status:
      label: "Status"
    duration:
      label: "Duration"
      type: number
    reason:
      label: "Reason"
      type: text
    country:
      label: "Country"
      type: country
    listingDate:
      label: "Listing date"
      type: date
