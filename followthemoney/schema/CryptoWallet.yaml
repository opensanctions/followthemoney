CryptoWallet:
  label: Cryptocurrency wallet
  plural: Cryptocurrency wallets
  extends:
    - Thing
    - Value
  description: >
    A cryptocurrency wallet is a view on the transactions conducted by one participant
    on a blockchain / distributed ledger system.
  matchable: true
  featured:
    - cryptoAddress
    - publicKey
    - currency
    - blockchain
  caption:
    - cryptoAddress
    - publicKey
    - name
    - summary
  temporalExtent:
    start:
      - creationDate
  properties:
    publicKey:
      label: Public key
      description: "Public key the wallet's addresses are derived from. Use cryptoAddress for the address itself"
      type: identifier
      maxLength: 512
    cryptoAddress:
      label: Crypto address
      description: "The crypto address of the wallet"
      type: identifier
      maxLength: 512
    privateKey:
      label: Private key
    accountId:
      label: Account ID
      description: Platform-specific user/account identifier
      type: identifier
    creationDate:
      label: Creation date
      type: date
    currencySymbol:
      label: Currency short code
    blockchain:
      label: Blockchain
      description: "Network the address belongs to, e.g. bitcoin, ethereum, tron, bsc, solana. The asset held goes in currency"
    managingExchange:
      label: Managing exchange
    holder:
      label: Wallet holder
      type: entity
      range: LegalEntity
      reverse:
        name: cryptoWallets
        label: "Cryptocurrency wallets"
    balance:
      label: Balance
      type: number
    balanceDate:
      label: Balance date
      type: date
    custodyType:
      label: Custody type
      description: "Who holds the funds: selfHosted (the holder controls the keys) or custodial (an exchange or other service holds them)"
