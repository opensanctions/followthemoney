[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "followthemoney"
version = "4.10.0"
description = "A data model for anti corruption data modeling and analysis."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    # { name = "Organized Crime and Corruption Reporting Project", email = "data@occrp.org" },
    { name = "OpenSanctions", email = "info@opensanctions.org" },
    { name = "DARC", email = "hi@dataresearchcenter.org" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">= 3.10"
dependencies = [
    "babel >= 2.14.0, < 3.0.0",
    "pyyaml >= 5.0.0, < 7.0.0",
    "banal >= 1.0.0, < 1.2.0",
    "rigour >= 2.0.0, < 3.0.0",
    "click >= 8.0, < 9.0.0",
    "requests >= 2.21.0, < 3.0.0",
    "normality >= 3.1.0, < 4.0.0",
    "sqlalchemy[mypy] >= 2.0.0, < 3.0.0",
    "prefixdate >= 0.5.0, < 1.0.0",
    "phonenumbers >= 8.12.22, < 10.0.0",
    "pytz >= 2021.1",
    "rdflib >= 6.2.0, < 7.7.0",
    "networkx >= 2.5, < 3.5",
    "openpyxl >= 3.0.5, < 4.0.0",
    "orjson >= 3.10.0, < 4.0",
    "pydantic >=2.11.0, < 3.0.0",
    "rich >= 13.0.0, < 16.0.0",
]

[project.urls]
Documentation = "https://followthemoney.tech/"
Repository = "https://github.com/opensanctions/followthemoney.git"
Issues = "https://github.com/opensanctions/followthemoney/issues"

[project.optional-dependencies]
dev = [
    "pip>=10.0.0",
    "bump2version",
    "wheel>=0.29.0",
    "twine",
    "build",
    "mypy",
    "pytest",
    "pytest-cov",
    "types-PyYAML",
    "types-requests",
    "types-setuptools",
    "types-openpyxl",
    "types-PyYAML",
    "ruff>=0.16.0",
    "transifex-client",
    "responses>=0.9.0",
    "coverage>=4.1",
    "recommonmark>=0.4.0",
]
docs = [
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-gen-files",
    "mkdocs-macros-plugin",
    "mkdocstrings[python]",
]

[project.scripts]
ftmutil = "followthemoney.cli.cli:cli"
ftm = "followthemoney.cli.cli:cli"
followthemoney = "followthemoney.cli.cli:cli"

[project.entry-points."babel.extractors"]
ftmmodel = "followthemoney.messages:extract_yaml"

[project.entry-points."followthemoney.cli"]
aggregate = "followthemoney.cli.aggregate:aggregate"
sieve = "followthemoney.cli.sieve:sieve"
mapping = "followthemoney.cli.mapping:run_mapping"
csv = "followthemoney.cli.exports:export_csv"
excel = "followthemoney.cli.exports:export_excel"
rdf = "followthemoney.cli.exports:export_rdf"
gexf = "followthemoney.cli.exports:export_gexf"
cypher = "followthemoney.cli.exports:export_cypher"
statements = "followthemoney.cli.statement:entity_statements"
ref = "followthemoney.cli.ref:ref"

[tool.hatch.build.targets.sdist]
only-include = ["followthemoney", "LICENSE", "README.md"]

[tool.distutils.bdist_wheel]
universal = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# `target-version` is inferred from `project.requires-python` (3.10).
extend-exclude = ["site", "docs"]

[tool.ruff.lint]
# We take ruff's default rule selection as-is, so a ruff upgrade brings in new
# checks by design. `ignore` records the deliberate exceptions:
ignore = [
    # `@cache` on methods is intentional on our singletons (Model, Schema).
    # These live in hot paths and are never collected, so the leak B019 warns
    # about does not apply.
    "B019",
    # Wants `Self` instead of a bound TypeVar, which on 3.10 means importing
    # typing_extensions. Revisit if we ever require 3.11.
    "PYI019",
    # Wants `__eq__(self, other: object)`. Correct, but our implementations
    # reach for `other.id` unguarded, so adopting it means narrowing `__eq__`
    # on EntityProxy, Statement, Node and Edge -- a behaviour change (today a
    # mismatched type raises AttributeError) on hot-path classes.
    "PYI032",
]

[tool.babel.extractors.followthemoney]
"followthemoney/**.py" = "python"
"followthemoney/schema/**.yaml" = "ftmmodel"

[tool.coverage.run]
branch = true
omit = [
    "followthemoney/ontology.py",
    "followthemoney/messages.py",
]
